[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jezz"
version = "0.1.0"
description = "Formalized agent behavior basis, enforceable software building codes, and Pydantic AI runtime."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "icontract>=2.7.3",
    "pydantic>=2.14.4",
    "pydantic-ai>=2.71.0",
    "pydantic-graph>=2.71.0",
]

[project.scripts]
jezz = "jezz.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.16",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
strict_config = true
strict_markers = true

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["jezz", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
