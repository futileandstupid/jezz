[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jezz"
version = "0.2.0"
description = "Formalized agent behavior basis, enforceable software building codes, and Pydantic AI runtime."
readme = "README.md"
requires-python = ">=3.14"
keywords = [
    "coding-agents",
    "design-by-contract",
    "mcp",
    "pydantic-ai",
    "software-building-codes",
    "static-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "icontract>=2.7.3",
    "mcp>=2.3.0",
    "pydantic>=2.14.4",
    "pydantic-ai>=2.71.0",
    "pydantic-evals>=2.71.0",
    "pydantic-graph>=2.71.0",
    "tree-sitter>=0.27.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
]

[project.urls]
Homepage = "https://github.com/futileandstupid/jezz"
Repository = "https://github.com/futileandstupid/jezz"
Documentation = "https://github.com/futileandstupid/jezz/blob/main/docs/whitepaper.md"

[project.scripts]
jezz = "jezz.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.16",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
strict_config = true
strict_markers = true

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["jezz", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.jezz.models]
default = "google:gemini-3.8-flash"

[tool.jezz.secrets]
agent_reason = "jezz PCE runtime resolving model API credential"
timeout_sec = 15.0

[tool.jezz.secrets.providers]
google = "pass://AI-Keys/Gemini Developer API/API Key"
