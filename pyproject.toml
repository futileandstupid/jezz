[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jezz"
version = "0.6.1"
description = "Formalized agent behavior basis, enforceable software building codes, and Pydantic AI runtime."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
keywords = [
    "coding-agents",
    "design-by-contract",
    "mcp",
    "pydantic-ai",
    "software-building-codes",
    "static-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "icontract>=2.7.3",
    "mcp>=2.3.0",
    "platformdirs>=4.3.0",
    "pydantic>=2.14.4",
    "pydantic-ai>=2.71.0",
    "pydantic-evals>=2.71.0",
    "pydantic-graph>=2.71.0",
    "tree-sitter>=0.27.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
    "z3-solver>=5.4.1.0",
]

[project.urls]
Homepage = "https://github.com/futileandstupid/jezz"
Repository = "https://github.com/futileandstupid/jezz"
Documentation = "https://github.com/futileandstupid/jezz/blob/main/docs/whitepaper.md"

[project.scripts]
jezz = "jezz.cli:main"

[tool.hatch.build]
exclude = [
    "**/node_modules",
    "**/target",
    "**/.venv",
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/.hypothesis",
    "**/dist",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/jezz",
    "templates",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jezz"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "jezz/_templates"

[dependency-groups]
dev = [
    "hypothesis>=6.170.16",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
docs = [
    "mkdocs-material>=9.8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
strict_config = true
strict_markers = true

[tool.mypy]
python_version = "3.14"
mypy_path = ["src", "stubs"]
packages = ["jezz", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.coverage.run]
source = ["jezz"]
branch = false

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.\\s*$",
    "if __name__ == .__main__.:",
]

[tool.jezz.models]
default = "google:gemini-3.8-flash"

