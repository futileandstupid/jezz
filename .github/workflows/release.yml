name: Release Package & PyPI Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-dist:
    name: Verify Version Parity & Build Distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository with full Git graph
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install pinned Python runtime (.python-version)
        run: uv python install

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Verify Git tag matches package version
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          EXPECTED_VER="${RELEASE_REF_NAME#v}"
          ACTUAL_VER="$(uv run --no-sync python -c 'import jezz; print(jezz.__version__)')"
          if [[ "$EXPECTED_VER" != "$ACTUAL_VER" ]]; then
            echo "Tag version '$EXPECTED_VER' mismatches jezz.__version__ '$ACTUAL_VER'." >&2
            exit 1
          fi

      - name: Enforce JBC Edition 1.3, Z3 Proofs, & Dynamic Suite Gates
        run: |
          uv run jezz inspect .
          uv run jezz prove . --require-deductive
          uv run mypy .
          uv run ruff check .
          uv run pytest -q --cov=jezz --cov-fail-under=92

      - name: Setup Node.js for @jezz/blueprint CAD package
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "packages/jezz-blueprint/package-lock.json"

      - name: Verify @jezz/blueprint TypeScript strict check & Vitest CAD suite
        run: |
          npm --prefix packages/jezz-blueprint ci
          npm --prefix packages/jezz-blueprint run typecheck
          npm --prefix packages/jezz-blueprint test

      - name: Build sdist and wheel
        run: |
          uv build
          ls -lh dist/*.whl dist/*.tar.gz

      - name: Attest SLSA build provenance for distributions
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "dist/*"

  publish-pypi:
    name: Publish to PyPI (Trusted Publisher)
    needs: build-dist
    if: vars.ENABLE_PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jezz
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Build and publish distributions via Trusted Publishing
        run: |
          uv build
          uv publish --trusted-publishing always

  sync-templates:
    name: Sync Polyglot GitHub Template Repositories
    needs: build-dist
    if: vars.ENABLE_TEMPLATE_SYNC == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [python, typescript, rust, go]
    steps:
      - name: Checkout jezz release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Push templates/${{ matrix.lang }} to jezz-template-${{ matrix.lang }}
        env:
          TEMPLATE_LANG: ${{ matrix.lang }}
          SYNC_TOKEN: ${{ secrets.TEMPLATE_SYNC_PAT }}
          REPO_OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "$SYNC_TOKEN" ]]; then
            echo "TEMPLATE_SYNC_PAT secret is empty; skipping sync."
            exit 0
          fi
          WORK="$(mktemp -d)"
          cp -R "templates/$TEMPLATE_LANG/." "$WORK/"
          git -C "$WORK" init -b main
          git -C "$WORK" config user.name "jezz-release-bot"
          git -C "$WORK" config user.email "ci@jezz.local"
          git -C "$WORK" add -A
          git -C "$WORK" commit -m "chore(template): sync from jezz $RELEASE_TAG"
          git -C "$WORK" push --force "https://x-access-token:${SYNC_TOKEN}@github.com/${REPO_OWNER}/jezz-template-${TEMPLATE_LANG}.git" main
          rm -rf "$WORK"
