name: JBC v1.3 Statutory Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: jbc-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jbc-occupancy-gate:
    name: Enforce JBC Edition 1.3 & Verification Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository with full Git graph
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install pinned Python runtime (.python-version)
        run: uv python install

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Gate 1 — Ruff lint & format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Gate 2 — Mypy strict static soundness (JBC-VRF-005)
        run: uv run mypy .

      - name: Gate 3 — Pytest, Hypothesis & 92% Coverage Ratchet (JBC-VRF-006)
        run: uv run pytest --cov=jezz --cov-fail-under=92

      - name: Gate 4 — Differential Occupancy Ratchet (PR diff)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: uv run jezz inspect . --changed-since "$BASE_REF"

      - name: Gate 5 — Full-Repository JBC v1.3 Rough-In Inspection
        run: uv run jezz inspect .

      - name: Gate 6 — Polyglot Z3 Symbolic Contract Proofs
        run: uv run jezz prove . --require-deductive

      - name: Gate 7 — Dogfood Reusable Composite GitHub Action (action.yml)
        uses: ./
        with:
          working-directory: "."
          mode: "full"
          language: "python"
          prove: "require-deductive"

      - name: Setup Node.js for @jezz/blueprint CAD package
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            packages/jezz-blueprint/package-lock.json
            templates/typescript/package-lock.json

      - name: Gate 8 — @jezz/blueprint & TypeScript template strict check & Vitest suite
        run: |
          npm --prefix packages/jezz-blueprint ci
          npm --prefix packages/jezz-blueprint run typecheck
          npm --prefix packages/jezz-blueprint test
          npm --prefix templates/typescript ci
          npm --prefix templates/typescript run typecheck
          npm --prefix templates/typescript test
